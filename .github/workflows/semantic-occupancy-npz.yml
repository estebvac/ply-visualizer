name: Semantic occupancy NPZ verification

on:
  push:
    branches:
      - feature/semantic-occupancy-npz
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-occupancy-npz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node dependencies
        run: npm ci

      - name: Rust semantic NPZ unit tests
        run: cargo test --locked --manifest-path wasm/pointcloud-parser/Cargo.toml semantic_npz

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Rebuild committed WASM artifacts
        run: |
          npm run build:wasm
          npm run check:wasm

      - name: Commit refreshed WASM packages and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wasm/artifacts.json wasm/pointcloud-parser/pkg wasm/pointcloud-parser/pkg-web wasm/tiff-decoder/pkg-nodejs engine/media/wasm
          if ! git diff --cached --quiet; then
            git commit -m "chore(npz): commit rebuilt semantic occupancy WASM artifacts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Compile extension and test types
        run: |
          npm run compile:tests
          npm run check --workspace=engine
          npm run compile

      - name: Build browser and run NPZ depth regressions
        run: |
          npm run build --workspace=engine
          npm exec -- playwright install --with-deps chromium
          cd engine
          npm exec -- playwright test test/npy-rust-reader.spec.ts --workers=1 --retries=0

      - name: Package NPZ verification VSIX
        run: npm exec -- vsce package --no-dependencies -o ply-visualizer-semantic-occupancy-npz.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: semantic-occupancy-npz-vsix
          path: ply-visualizer-semantic-occupancy-npz.vsix
