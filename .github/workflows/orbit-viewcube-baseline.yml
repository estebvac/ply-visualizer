name: Orbit and ViewCube baseline

on:
  push:
    branches:
      - main
      - integration/orbit-viewcube-main-v2
  workflow_dispatch:

concurrency:
  group: orbit-viewcube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build standalone viewer
        run: npm run build --workspace=engine

      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: Verify Standard Orbit and ViewCube baseline
        working-directory: engine
        run: npm exec -- playwright test test/view-cube-transform.spec.ts test/view-cube-baseline.spec.ts
