name: Test Orbit navigation

on:
  push:
    branches:
      - feature/orbitcontrols-navigation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies with one webview dependency tree
        run: |
          pnpm install --frozen-lockfile
          pnpm add @sparkjsdev/spark@2.1.0 @playwright/test@1.59.1 --ignore-scripts
          git checkout -- package.json pnpm-lock.yaml
          rm -rf engine/node_modules
          ln -s ../node_modules engine/node_modules

      - name: Compile extension and tests
        run: pnpm run compile:all

      - name: Install Xvfb for VS Code Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run extension-host tests
        run: xvfb-run -a pnpm test
