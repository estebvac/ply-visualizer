name: Test Orbit navigation

on:
  push:
    branches:
      - feature/orbitcontrols-navigation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies with one webview dependency tree
        run: |
          pnpm install --frozen-lockfile
          pnpm add @sparkjsdev/spark@2.1.0 @playwright/test@1.59.1 --ignore-scripts
          git checkout -- package.json pnpm-lock.yaml
          rm -rf engine/node_modules
          ln -s ../node_modules engine/node_modules

      - name: Compile extension and tests
        run: pnpm run compile:all

      - name: Lint
        run: pnpm run lint

      - name: Check feature diff whitespace
        run: git diff --check origin/recovered/voxel-camera-ui...HEAD

      - name: Build standalone engine
        run: cd engine && pnpm run build

      - name: Install Playwright Chromium and host dependencies
        run: cd engine && pnpm exec playwright install --with-deps chromium

      - name: Run focused navigation regressions
        run: |
          cd engine
          pnpm exec playwright test \
            test/orbit-navigation.spec.ts \
            test/point-picking.spec.ts \
            test/controls-camera-tabs.spec.ts \
            test/zoom-after-rotate.spec.ts \
            test/rotation-drift-check.spec.ts \
            test/inverse-trackball-rotation.spec.ts \
            test/measure-accumulated-roll.spec.ts \
            --project=chromium

      - name: Verify recovery-baseline exclusions are unchanged
        run: |
          git diff --exit-code origin/recovered/voxel-camera-ui...HEAD -- \
            engine/test/file-list-interactions.spec.ts \
            engine/test/large-lidar-chunking.spec.ts \
            engine/src/largeFileChunking.ts

      - name: Run remaining engine browser suite
        run: |
          cd engine
          pnpm exec playwright test \
            --grep-invert "shift-click toggles between one visible file and all visible files|typed LiDAR chunks preserve packed arrays, scalar fields, and metadata|orbit matches normal trackball|roll inverts sign vs normal trackball|accumulated roll inverts|Standard Orbit navigation|sustained inverse-trackball rotation|zoom after rotate|Controls and Camera tabs" \
            --project=chromium

      - name: Run VS Code extension-host suite
        run: xvfb-run -a pnpm test

      - name: Package feature VSIX
        run: |
          mkdir -p artifacts
          pnpm dlx @vscode/vsce package --out artifacts/ply-visualizer-orbitcontrols-navigation.vsix
          sha256sum artifacts/ply-visualizer-orbitcontrols-navigation.vsix | tee artifacts/SHA256SUMS

      - name: Upload feature VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ply-visualizer-orbitcontrols-navigation
          path: |
            artifacts/ply-visualizer-orbitcontrols-navigation.vsix
            artifacts/SHA256SUMS
