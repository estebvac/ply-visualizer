name: Export recovery base

on:
  push:
    branches:
      - recovery-base-export

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package base source
        run: |
          zip -qr recovery-base-dca.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-base-dca
          path: recovery-base-dca.zip
